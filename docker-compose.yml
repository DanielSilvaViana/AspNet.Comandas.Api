version: '3.4'

services:
  comandas.api:
    image: ${DOCKER_REGISTRY-}comandasapi
    build:
      context: Comandas.Api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    networks:
     - comandaNetworking
  sqlserver:
    image: mcr.microsoft.com/mssql/server:latest
    environment:  
     MSSQL_DATABASE: comandas
     MSSQL_USER: usuario
     MSSQL_PASSWORD: senhaSegura!123
     MSSQL_PID: "Express"
     ACCEPT_EULA: "Y"
     SA_PASSWORD: "senhaDoSA!123"
    volumes:
      - comandas_db_data:/var/opt/mssql
    ports:
      - "1433:1433"
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - comandaNetworking
    volumes:
      - redis_data:/data
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - comandaNetworking
volumes:
   comandas_db_data:
   redis_data:
networks:
  comandaNetworking:
 
 
